org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configureondemand=true

# 自定义 fatJar 任务在 configuration cache 下有兼容问题，先关掉（如需要可再开启）
org.gradle.configuration-cache=false
org.gradle.configuration-cache.parallel=false
org.gradle.configuration-cache.problems=warn

net.minecraftforge.gradle.merge-source-sets=true

# ---------------------------------------------------------------------------
# Forge 1.21.11 (ForgeGradle 7) 的 Minecraft Mavenizer 工具要求 Java 25 工具链。
# 如果你的 JDK 25 不在 Gradle 默认能找到的位置（常见），把下面这行取消注释并改成
# 你本机 JDK 25 的路径；同时关闭自动下载（foojay 去 GitHub 下载，国内网络常不通）。
# ---------------------------------------------------------------------------
# org.gradle.java.installations.paths=C\:\\path\\to\\jdk-25
org.gradle.java.installations.auto-download=false

# ---------------------------------------------------------------------------
# 模组版本信息
# ---------------------------------------------------------------------------
mod_id=vplayer
mod_name=VPlayer Video Player
mod_license=MIT
mod_version=1.0.0
mod_group_id=com.vplayer
minecraft_version=1.21.11
forge_version=61.2.5
