plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '[6.0.24,6.2)'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Minecraft 1.21.1 官方发行版要求 Java 21
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

minecraft {
    mappings channel: 'official', version: minecraft_version

    // 1.21.1（Forge 52.x）运行时使用 official 映射，不需要 reobf。
    // 见官方 1.21.1 MDK：https://maven.minecraftforge.net/net/minecraftforge/forge/1.21.1-52.1.12/forge-1.21.1-52.1.12-mdk.zip
    reobf = false

    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                vplayer {
                    source sourceSets.main
                }
            }
        }
        client {
        }
        server {
            args '--nogui'
        }
    }
}

repositories {
    maven {
        name = 'MinecraftForge'
        url = 'https://maven.minecraftforge.net/'
    }
    mavenCentral()
}

configurations {
    natives
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    // 编译只需要 JavaCV/FFmpeg 的 Java 类；platform 工件（含全部平台原生库）只用于 fatJar 打包
    compileOnly 'org.bytedeco:javacv:1.5.11'
    natives 'org.bytedeco:javacv-platform:1.5.11'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

jar {
    manifest {
        attributes(
                'Implementation-Title': 'VPlayer',
                'Implementation-Version': project.version
        )
    }
}

// ---------------------------------------------------------------------------
// 可分发 fatJar：模组本体 + JavaCV/FFmpeg 类与原生库。
// 1.21.1 Forge 运行时就是 official 映射（reobf = false），所以类直接取自
// sourceSets.main.output，不需要从 reobfJar 取。
// 只保留 Windows 的 ffmpeg + javacpp（64 个 dll），排除 opencv/tesseract/openblas
// 等多余模块（会导致原生库加载冲突）与其它平台原生库。
// ---------------------------------------------------------------------------
tasks.register('fatJar', Jar) {
    dependsOn tasks.jar
    archiveClassifier = 'all'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    // 模组类 + 资源（assets/data/pack.mcmeta/META-INF/mods.toml）
    from(sourceSets.main.output)

    from({
        configurations.natives.filter {
            it.name.contains('javacv') || it.name.contains('ffmpeg') || it.name.contains('javacpp') || it.name.contains('opencv')
        }.collect { zipTree(it) }
    }) {
        exclude 'META-INF/MANIFEST.MF'
        exclude 'META-INF/*.SF'
        exclude 'META-INF/*.DSA'
        exclude 'META-INF/*.RSA'
        exclude '**/module-info.class'
        exclude 'org/bytedeco/opencv/**'
        exclude 'org/bytedeco/openblas/**'
        exclude 'org/bytedeco/tesseract/**'
        exclude 'org/bytedeco/leptonica/**'
        exclude 'org/bytedeco/flycapture/**'
        exclude 'org/bytedeco/libdc1394/**'
        exclude 'org/bytedeco/libfreenect/**'
        exclude 'org/bytedeco/libfreenect2/**'
        exclude 'org/bytedeco/librealsense/**'
        exclude 'org/bytedeco/librealsense2/**'
        exclude 'org/bytedeco/videoinput/**'
        exclude 'org/bytedeco/artoolkitplus/**'
        exclude 'org/bytedeco/*/linux-*/*'
        exclude 'org/bytedeco/*/macosx-*/*'
    }

    manifest {
        attributes(
                'Implementation-Title': 'VPlayer',
                'Implementation-Version': project.version
        )
    }

    doLast {
        logger.lifecycle("[vplayer] fatJar 完成: ${archiveFile.get().asFile} (${archiveFile.get().asFile.length()} 字节)")
    }
}
