plugins {
    id 'java'
    id 'net.neoforged.moddev.legacyforge' version '2.0.91'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// 1.20.1 官方发行版就是 Java 17
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

// ---------------------------------------------------------------------------
// 本机 maven.neoforged.net 的 DNS 被污染（解析到无效 IP），无法直连。
// 官方 CDN 镜像 neoforged.forgecdn.net 完整镜像了 /releases 与 /mojang-meta 两个根，
// 所以把所有指向 maven.neoforged.net 的仓库地址整体替换成镜像地址。
// ---------------------------------------------------------------------------
def MIRROR_ROOT = 'https://neoforged.forgecdn.net'
def MIRROR_HOST = 'maven.neoforged.net'
def rewriteNeoForgedRepo = { repo ->
    if (repo instanceof MavenArtifactRepository) {
        String u = repo.url.toString()
        int i = u.indexOf(MIRROR_HOST)
        if (i >= 0) {
            String mirrored = MIRROR_ROOT + u.substring(i + MIRROR_HOST.length())
            repo.url = mirrored
            logger.lifecycle("[vplayer] 仓库镜像: ${u} -> ${mirrored}")
        }
    }
}
repositories.all(rewriteNeoForgedRepo)
repositories.configureEach(rewriteNeoForgedRepo)

repositories {
    mavenCentral()
}

legacyForge {
    // NeoForge 1.20.1（47.1.x）——注意 artifact 名仍是 forge
    enable {
        neoForgeVersion = project.neo_version
    }

    runs {
        client {
            client()
            // 隔离测试实例目录（不碰用户游戏）
            gameDirectory = project.file('run-mctest')
            programArguments.addAll '--username', 'Dev', '--uid', '12345678-1234-1234-1234-123456789012'
            // 自检实例自动进入预先准备好的平面世界
            programArguments.addAll '--quickPlaySingleplayer', 'selftest'
            systemProperty 'forge.logging.markers', 'REGISTRIES'
        }
        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    // JavaCV + FFmpeg：视频解码/播放（fatJar 会把需要的原生库打进去）
    implementation 'org.bytedeco:javacv-platform:1.5.11'
}

// ---------------------------------------------------------------------------
// 仅开发环境（gradle runClient）需要：JavaCV 的 jar 带 module-info，声明 requires
// javafx.graphics；一旦放进游戏模块层就会启动失败。这里给 dev 运行生成一份去掉
// module-info 的副本，再放进 legacy classpath（GAME 层），正式 fatJar 不受影响。
// ---------------------------------------------------------------------------
configurations {
    javacvDevDeps {
        canBeConsumed = false
        canBeResolved = true
    }
}

dependencies {
    javacvDevDeps 'org.bytedeco:javacv-platform:1.5.11'
}

def javacvDevJarsDir = layout.buildDirectory.dir('javacv-dev-jars')
def sanitizeJavacvJars = tasks.register('sanitizeJavacvJars') {
    def deps = configurations.javacvDevDeps
    inputs.files(deps)
    outputs.dir(javacvDevJarsDir)
    doLast {
        def outDir = javacvDevJarsDir.get().asFile
        outDir.mkdirs()
        // 只保留核心 jar + Windows 原生库，避免复制上 GB 的其它平台 jar
        def platformSuffixes = ['-linux-x86_64', '-linux-x86', '-linux-arm64', '-linux-armhf', '-linux-ppc64le',
                                '-linux-ppc64', '-macosx-x86_64', '-macosx-arm64', '-android-x86', '-android-x86_64',
                                '-android-arm', '-android-arm64', '-ios-x86_64', '-ios-arm64', '-windows-x86', '-windows-arm64']
        def isNeeded = { String n ->
            boolean bytedecoCore = n.startsWith('javacv-') || n.startsWith('javacpp-') || n.startsWith('ffmpeg-')
            if (!bytedecoCore || !n.endsWith('.jar')) {
                return false
            }
            if (n.contains('-windows-x86_64')) {
                return true
            }
            return !platformSuffixes.any { n.endsWith(it + '.jar') }
        }
        deps.files.each { src ->
            if (!isNeeded(src.name)) {
                return
            }
            def dst = new File(outDir, src.name)
            def skipEntry = { String n ->
                n == 'module-info.class' || (n.startsWith('META-INF/versions/') && n.endsWith('/module-info.class'))
            }
            def jf = new java.util.jar.JarFile(src)
            try {
                def jos = new java.util.jar.JarOutputStream(new java.io.FileOutputStream(dst))
                try {
                    jf.entries().each { entry ->
                        if (skipEntry(entry.name)) {
                            return
                        }
                        jos.putNextEntry(new java.util.zip.ZipEntry(entry.name))
                        if (!entry.isDirectory()) {
                            def ins = jf.getInputStream(entry)
                            try {
                                jos.write(ins.bytes)
                            } finally {
                                ins.close()
                            }
                        }
                        jos.closeEntry()
                    }
                } finally {
                    jos.close()
                }
            } finally {
                jf.close()
            }
        }
    }
}

def sanitizedJavacvJars = files(provider {
    def dir = javacvDevJarsDir.get().asFile
    dir.listFiles()?.findAll { it.name.endsWith('.jar') } ?: []
}).builtBy(sanitizeJavacvJars)

dependencies {
    additionalRuntimeClasspath sanitizedJavacvJars
}

// legacy classpath 文件在生成前必须先有去掉 module-info 的 jar
tasks.matching { it.name == 'writeClientLegacyClasspath' }.configureEach {
    dependsOn sanitizeJavacvJars
}

// ---------------------------------------------------------------------------
// 本机无法直连 maven.neoforged.net（DNS 污染）导致 NFRT（生成 Minecraft 工件的
// 工具）联网下载失败。NFRT 会优先使用 --artifact-manifest 里 Gradle 已解析好的
// 文件，这里把 1.20.1 旧版管线需要的 MCP 数据 / 工具也交给它，全部由 Gradle
// 从可访问的镜像仓库下载，避免 NFRT 自己联网。
// ---------------------------------------------------------------------------
configurations {
    legacyNfrtExtras {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
}

dependencies {
    legacyNfrtExtras 'de.oceanlabs.mcp:mcp_config:1.20.1-20230612.114412@zip'
    legacyNfrtExtras 'net.minecraftforge:mergetool:1.1.7:api@jar'
    legacyNfrtExtras 'net.minecraftforge:mergetool:1.1.7:fatjar@jar'
    legacyNfrtExtras 'net.minecraftforge:installertools:1.2.0:fatjar@jar'
    legacyNfrtExtras 'net.minecraftforge:installertools:1.3.2:fatjar@jar'
    legacyNfrtExtras 'net.minecraftforge:binarypatcher:1.1.1:fatjar@jar'
    legacyNfrtExtras 'net.neoforged.jst:jst-cli-bundle:1.0.72@jar'
    legacyNfrtExtras 'io.codechicken:DiffPatch:2.0.0.36:all@jar'
    legacyNfrtExtras 'org.jetbrains:annotations:24.0.1@jar'
}

// 所有 NFRT 任务（createMinecraftArtifacts / downloadAssets ...）都注入本地已解析文件
tasks.withType(net.neoforged.nfrtgradle.NeoFormRuntimeTask).configureEach { nfrtTask ->
    nfrtTask.addArtifactsToManifest(configurations.legacyNfrtExtras)
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

jar {
    manifest {
        attributes(
                'Implementation-Title': 'VPlayer',
                'Implementation-Version': project.version
        )
    }
}

// ---------------------------------------------------------------------------
// 可分发 fatJar：模组本体 + JavaCV/FFmpeg 类与原生库
// 只保留 ffmpeg + javacpp（多余模块会导致原生库加载冲突），并排除其他平台，
// 与 1.21.1 成品保持一致。
// ---------------------------------------------------------------------------
def fatJarTask = tasks.register('fatJar', Jar) {
    dependsOn tasks.jar
    archiveClassifier = 'all'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    from sourceSets.main.output
    from(zipTree(tasks.jar.archiveFile)) {
        exclude 'META-INF/MANIFEST.MF'
    }

    def nativeLibs = configurations.runtimeClasspath.filter {
        it.name.contains('javacv') || it.name.contains('ffmpeg') || it.name.contains('javacpp') || it.name.contains('opencv')
    }
    from(nativeLibs.collect { zipTree(it) }) {
        exclude 'META-INF/MANIFEST.MF'
        exclude 'META-INF/*.SF'
        exclude 'META-INF/*.DSA'
        exclude 'META-INF/*.RSA'
        exclude '**/module-info.class'
        // 只保留 Windows 原生库，避免 jar 过大 / 加载冲突
        exclude 'org/bytedeco/opencv/**'
        exclude 'org/bytedeco/openblas/**'
        exclude 'org/bytedeco/tesseract/**'
        exclude 'org/bytedeco/leptonica/**'
        exclude 'org/bytedeco/flycapture/**'
        exclude 'org/bytedeco/libdc1394/**'
        exclude 'org/bytedeco/libfreenect/**'
        exclude 'org/bytedeco/libfreenect2/**'
        exclude 'org/bytedeco/librealsense/**'
        exclude 'org/bytedeco/librealsense2/**'
        exclude 'org/bytedeco/videoinput/**'
        exclude 'org/bytedeco/artoolkitplus/**'
        exclude 'org/bytedeco/*/linux-*/*'
        exclude 'org/bytedeco/*/macosx-*/*'
    }

    manifest {
        attributes(
                'Implementation-Title': 'VPlayer',
                'Implementation-Version': project.version
        )
    }
}

// 1.20.1 正式环境需要 SRG 映射：让 MDG 对 fatJar 也做 reobf
obfuscation {
    reobfuscate(fatJarTask, sourceSets.main)
}

// ---------------------------------------------------------------------------
// Windows 下 CreateProcess 命令行长度上限约 32K：reobf 任务默认把几十个 MC/NeoForge
// 依赖 jar 作为“继承数据 classpath”传给 AutoRenamingTool，命令行会被撑爆
// （CreateProcess error=206）。继承数据只需要合并后的 MC+NeoForge 单个 jar 即可。
// ---------------------------------------------------------------------------
def minecraftGameJar = tasks.named('createMinecraftArtifacts').map { t ->
    t.outputs.files.files.findAll { File f -> f.name.endsWith('.jar') && !f.name.contains('sources') }
}
tasks.withType(net.neoforged.moddevgradle.legacyforge.tasks.RemapJar).configureEach { remapTask ->
    remapTask.libraries.setFrom(minecraftGameJar)
}

