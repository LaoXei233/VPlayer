plugins {
    id 'java'
    id 'net.neoforged.gradle.userdev' version '7.0.145'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    maven {
        name = 'NeoForgedOfficial'
        url = 'https://maven.neoforged.net/releases'
    }
    maven {
        name = 'ForgeCDN'
        url = 'https://neoforged.forgecdn.net/releases'
    }
    mavenCentral()
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"
    // JavaCV + FFmpeg 全平台 natives（播放各类视频/网络流）
    implementation 'org.bytedeco:javacv-platform:1.5.11'
}

runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'
        modSource project.sourceSets.main
    }
    client {
    }
    server {
        programArgument '--nogui'
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

jar {
    manifest {
        attributes(
                'Implementation-Title': 'VPlayer',
                'Implementation-Version': project.version
        )
    }
}

// 合并 JavaCV/FFmpeg 依赖为单个可分发 jar
tasks.register('fatJar', Jar) {
    dependsOn tasks.jar
    archiveClassifier = 'all'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from sourceSets.main.output
    from(zipTree(tasks.jar.archiveFile)) {
        exclude 'META-INF/MANIFEST.MF'
    }
    def nativeLibs = configurations.runtimeClasspath.filter {
        it.name.contains('javacv') || it.name.contains('ffmpeg') || it.name.contains('javacpp') || it.name.contains('opencv')
    }
    from(nativeLibs.collect { zipTree(it) }) {
        exclude 'META-INF/MANIFEST.MF'
        exclude 'META-INF/*.SF'
        exclude 'META-INF/*.DSA'
        exclude 'META-INF/*.RSA'
        exclude '**/module-info.class'
        // 只保留 Windows 原生库，避免 jar 过大
        // 只保留 ffmpeg + javacpp 原生库（多余模块会导致加载冲突）
        exclude 'org/bytedeco/opencv/**'
        exclude '**/*.exe'
        exclude '**/*.bat'
        exclude 'org/bytedeco/openblas/**'
        exclude 'org/bytedeco/tesseract/**'
        exclude 'org/bytedeco/leptonica/**'
        exclude 'org/bytedeco/flycapture/**'
        exclude 'org/bytedeco/libdc1394/**'
        exclude 'org/bytedeco/libfreenect/**'
        exclude 'org/bytedeco/libfreenect2/**'
        exclude 'org/bytedeco/librealsense/**'
        exclude 'org/bytedeco/librealsense2/**'
        exclude 'org/bytedeco/videoinput/**'
        exclude 'org/bytedeco/artoolkitplus/**'
        exclude 'org/bytedeco/*/linux-*/*'
        exclude 'org/bytedeco/*/macosx-*/*'
    }
    manifest {
        attributes(
                'Implementation-Title': 'VPlayer',
                'Implementation-Version': project.version
        )
    }
}
